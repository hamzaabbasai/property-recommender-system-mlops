[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-property-recommender"
version = "0.1.0"
description = "A two-stage Berlin short-stay recommender with FastAPI, React and MLOps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "joblib>=1.4,<2.0",
  "mlflow>=3.0,<4.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.9,<3.0",
  "PyYAML>=6.0,<7.0",
  "scikit-learn>=1.5,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
ml = [
  "faiss-cpu>=1.9,<2.0",
  "lightgbm>=4.5,<5.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.8,<1.0",
]
notebooks = [
  "jupyterlab>=4.3,<5.0",
  "matplotlib>=3.9,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
